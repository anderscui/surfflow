[project]
name = "surfflow-server"
version = "0.1.0"
description = "SurfFlow backend APIs."
readme = "README.md"
authors = [
    { name = "andersc", email = "anderscui@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dateparser>=1.5.1",
    "ebooklib>=0.21",
    "elasticsearch>=9.4.1",
    "fastapi>=0.162.7",
    "humanize>=4.17.0",
    "jinja2>=3.1.6",
    "loguru>=0.8.0",
    "lxml>=6.1.1",
    "markdown-it-py>=4.3.0",
    "mutagen>=1.48.1",
    "openai>=3.51.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "python-dateutil>=4.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlmodel>=0.0.50",
    "tiktoken>=0.14.0",
    "toolz>=1.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
surfflow-server = "surfflow_server:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
